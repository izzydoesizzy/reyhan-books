<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyhan's Story Shelf</title>
  <meta name="description" content="Reyhan's Story Shelf — every book Reyhan has read, on a warm little bookshelf of her own. Browse the shelves, open a book, collect stamps in her reading passport.">
  <meta name="theme-color" content="#FBF5EA">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <meta property="og:title" content="Reyhan's Story Shelf">
  <meta property="og:description" content="Every book Reyhan has read, on a warm little bookshelf of her own.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://izzydoesizzy.github.io/reyhan-books/">
  <meta property="og:image" content="https://izzydoesizzy.github.io/reyhan-books/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 12 C18 7, 8 7, 5 10 L5 36 C8 33, 18 33, 24 38 C30 33, 40 33, 43 36 L43 10 C40 7, 30 7, 24 12 Z" fill="#E4593B"/>
        <path d="M24 12 C18 7, 8 7, 5 10 L5 36 C8 33, 18 33, 24 38 Z" fill="#F2A93B"/>
        <path d="M24 12 L24 38" stroke="#43342A" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Reyhan's <em>Story Shelf</em></span>
    </a>

    <nav class="topnav" aria-label="Sections">
      <a href="#/" data-nav="journey">Journey</a>
      <a href="#/shelves" data-nav="shelves">Shelves</a>
      <a href="#/passport" data-nav="passport">Passport</a>
      <a href="#/discover" data-nav="discover">Discover</a>
    </nav>

    <div class="topbar-actions">
      <button class="icon-btn" id="search-open" aria-label="Search the shelf" title="Search (press /)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button class="dice-btn" id="dice-btn" aria-label="Pick a random book">
        <span class="dice" aria-hidden="true">🎲</span><span class="dice-label">Pick for me!</span>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <p class="footer-note">Made with <span aria-hidden="true">❤️</span> by Reyhan &amp; Dad — one story at a time.</p>
    <p class="footer-links">
      <span id="footer-stats"></span> ·
      <a href="archived/" >the original shelf</a> ·
      <a href="https://github.com/izzydoesizzy/reyhan-books" rel="noopener">GitHub</a>
    </p>
  </footer>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search books">
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Search a title, author, or series…" autocomplete="off">
        <button class="icon-btn" id="search-close" aria-label="Close search">✕</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">Reyhan's Story Shelf needs JavaScript.
    The full reading log also lives in the <a href="https://github.com/izzydoesizzy/reyhan-books#readme">README</a>.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="library-data.js"></script>
  <script src="config.js"></script>
  <script src="covers.js"></script>
  <script src="share-cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
